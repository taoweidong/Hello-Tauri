# Cargo 构建配置：编译产物统一输出到项目根的 target/ 目录
[build]
target-dir = "target"

# 单文件 exe 的两项保证，编码进仓库以确保可复现（不依赖开发者本地环境变量）：
#   1. MSVC 工具链 —— webview2-com-sys 对 target_env=msvc 静态链接
#      WebView2LoaderStatic.lib，产物不需要 WebView2Loader.dll
#   2. +crt-static —— C 运行时静态链接进 exe，产物不需要 VCRUNTIME140.dll
#      （后者需目标机预装 VC++ Redistributable，会破坏「绿色单文件」目标）
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]