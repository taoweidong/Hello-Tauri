[package]
name = "hello-tauri"
version = "0.1.0"
description = "Hello-Tauri 桌面客户端"
authors = ["Taowd"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hello_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# service-residency（docs/design-service-residency-2026-10-10.md T-A~T-N）：tray-icon
# feature 开启内置托盘与菜单（tray-icon/muda 已在 Cargo.lock 锁定，不新增 crate；
# Windows 下纯 windows-sys 静态实现，PE 导入表零新增 DLL）。
tauri = { version = "2", features = ["tray-icon"] }
# T-D 路线 A：单实例（Windows 实现 = CreateMutexW + 消息唤回，静态链接）。
# 二次双击 exe → 唤回已有窗口，消除双进程并行轮询/外发的现存风险。
# 固定 2.4.5：2.5.0 起要求 tauri ^2.12，会把 tauri 从 2.11.6 基线顶走（Cargo.lock
# 的 tray-icon/muda 随之漂移、内网缓存面扩大）；2.4.5 兼容 tauri ^2.10。
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite（bundled：内置 C 源码随项目静态编译，不依赖系统 sqlite3 DLL）。
# 选 rusqlite 而非 tauri-plugin-sql：后者底层 sqlx+tokio 异步栈，对 crt-static
# 未验证，且 DB 路径锁死 AppConfig、与可配置存储目录冲突。rusqlite 同步、薄，
# 与 +crt-static 兼容性已 PoC 实测通过（产物零可分发 DLL）。
rusqlite = { version = "0.37", features = ["bundled"] }

# Agent 大模型 HTTP 通道（src-tauri/src/http.rs）。reqwest 已是 tauri 的传递依赖，
# 这里显式声明只为打开 native-tls 特性：TLS 走系统 schannel（Windows 组件，不新增
# 可分发 DLL，证书走系统库，兼容企业代理）。大模型服务不回 CORS 头，WebView 的
# window.fetch 会被浏览器层拦截，请求必须在宿主进程内发出 —— 对接记录见
# docs/design-llm-connection-2026-10-02.md §11。内网缓存需新增：hyper-tls、
# native-tls、schannel 三个 crate（都只依赖树内已有项）。
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

# 仅用于 GetLocalTime（本地时区日志时间戳）+ Windows 基础设施通道
# （sysinfo.rs / shell.rs：注册表、磁盘、网卡、ShellExecute、剪贴板、托盘气球通知）。
# 选它而非 chrono：chrono 会拉入 iana-time-zone，该 crate 不在内网缓存中，
# 会破坏「打包过程不访问公网」的约束；windows-sys 已在依赖树内且源码已缓存。
# 新增 feature 只扩展现有 crate，不引入新依赖 —— 剪贴板/通知同理不引第三方
# crate（arboard/notify-rust 均不在内网缓存清单），详见 design D3/D4 修订。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
